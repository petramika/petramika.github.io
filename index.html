<!doctype html>
<html lang="es" class="negative-mode">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Al hilo de texts.json: titulo, subtitulo y la frase de entrada. Estos
      no pueden leerse del JSON como el resto de la copia — un buscador o un
      chat lee el HTML tal y como llega, antes de que corra nada, asi que
      tienen que venir escritos aqui. Si cambia el texto de la portada,
      cambian estos tambien.
    -->
    <title>ROTA · Esto es sentir</title>
    <meta
      name="description"
      content="Se caen los valores de mi vida cuando solo veo dolor. Un ensayo visual sobre lo que se quiebra por dentro."
    />
    <meta property="og:site_name" content="ROTA" />
    <meta property="og:title" content="ROTA · Esto es sentir" />
    <meta
      property="og:description"
      content="Se caen los valores de mi vida cuando solo veo dolor. Un ensayo visual sobre lo que se quiebra por dentro."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://petramika.github.io/" />
    <meta property="og:locale" content="es_ES" />
    <!--
      Tarjeta pequena y sin imagen: las fotografias del ensayo se quedan
      fuera de los buscadores, y compartir un enlace no deberia ser la
      excepcion a eso.
    -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="ROTA · Esto es sentir" />
    <meta
      name="twitter:description"
      content="Se caen los valores de mi vida cuando solo veo dolor. Un ensayo visual sobre lo que se quiebra por dentro."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,400;1,700;1,900&family=Caveat:wght@500;600&family=Rubik+Glitch&family=Rubik+Moonrocks&family=IBM+Plex+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body class="bg-[#fbfbfb] text-[#141518] antialiased selection:bg-[#141518] selection:text-[#fbfbfb]">
    <div id="root"></div>
    <!--
      Que se indexe el ensayo, no las fotografias: noimageindex deja la
      pagina en los resultados de busqueda y mantiene sus imagenes fuera de
      la busqueda de imagenes. Es lo unico que lo consigue de verdad; el
      robots.txt solo impide que las rastreen, y una imagen enlazada desde
      fuera podria colarse igual.
    -->
    <meta name="robots" content="index, follow, noimageindex" />

    <!--
      La bola de papel, sobre la tinta de la pagina. El papel es blanco y a
      16px sobre una pestana clara desapareceria, asi que lleva su propio
      fondo: el mismo que tiene la web en su modo por defecto.
    -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" href="/favicon-512.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
